name: CI

on:
  # No base-branch filter: a stacked PR targets its parent branch and still needs CI.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # "source": "./" makes this repo its own plugin, so one call covers both manifests; --strict also fails unrecognized fields.
      - name: Validate manifests
        run: claude plugin validate . --strict

      - name: Shell syntax check
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Shellcheck
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 | xargs -0 -n1 shellcheck -x

      - name: JSON syntax check
        run: |
          set -euo pipefail
          find . -name '*.json' -not -path './node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 python3 -c 'import json,sys; json.load(open(sys.argv[1]))'

      # The scripts are the only executable surface here: the sweep's jq program handles untrusted input, the verdict's decides "green".
      - name: Sweep contract tests
        run: ./scripts/pr-comment-state.test.sh

      - name: CI verdict contract tests
        run: ./scripts/pr-ci-verdict.test.sh

      # Relative links only: a network checker fails on rate limits rather than on repo defects.
      - name: Relative link check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          bad = []
          for md in root.rglob('*.md'):
              if '.git' in md.parts:
                  continue
              for target in re.findall(r'\]\(([^)]+)\)', md.read_text(encoding='utf-8')):
                  link = target.split('#', 1)[0].strip()
                  if not link or '://' in link or link.startswith('mailto:'):
                      continue
                  if not (md.parent / link).resolve().exists():
                      bad.append(f'{md}: {link}')
          if bad:
              print('broken relative links:', *bad, sep='\n  ')
              sys.exit(1)
          print('relative links OK')
          PY

  # macOS ships bash 3.2 as /bin/bash: the scripts must run there, not only under the runner's newer bash.
  bash-3-2:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Contract tests under /bin/bash 3.2
        env:
          BASH_UNDER_TEST: /bin/bash
        run: |
          set -euo pipefail
          /bin/bash -c 'echo "script shell: bash $BASH_VERSION"'
          ./scripts/pr-comment-state.test.sh
          ./scripts/pr-ci-verdict.test.sh
